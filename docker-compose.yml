services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: herspace
      POSTGRES_USER: herspace
      POSTGRES_PASSWORD: herspace
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herspace -d herspace"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: dev-only-insecure-key-change-me
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://herspace:herspace@db:5432/herspace
      DB_SSLMODE: disable
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      FRONTEND_BASE_URL: http://localhost:5173
      PRIVATE_STORAGE_ROOT: /app/private_storage
      TOKEN_HASH_SALT: dev-only-salt-change-me
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
