name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: herspace
          POSTGRES_USER: herspace
          POSTGRES_PASSWORD: herspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U herspace -d herspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-insecure-key
      DEBUG: "False"
      DATABASE_URL: postgres://herspace:herspace@localhost:5432/herspace
      DB_SSLMODE: disable
      TOKEN_HASH_SALT: ci-only-salt

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (black)
        run: black --check .

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Tests with coverage
        run: pytest --cov=apps --cov=common --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: OpenAPI schema validation
        run: python manage.py spectacular --validate --file ../docs/openapi.yaml

      - name: Upload coverage artefact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn
