components:
  schemas:
    DismissedSuggestionsEnum:
      enum:
      - add_trusted_contact
      - first_mood_checkin
      - set_checkin_reminder
      - write_first_journal_entry
      - try_calm_space
      - create_routine
      type: string
      description: |-
        * `add_trusted_contact` - add_trusted_contact
        * `first_mood_checkin` - first_mood_checkin
        * `set_checkin_reminder` - set_checkin_reminder
        * `write_first_journal_entry` - write_first_journal_entry
        * `try_calm_space` - try_calm_space
        * `create_routine` - create_routine
    EmailChangeRequest:
      type: object
      description: |-
        Reject unknown body fields (api-documentation.md §1.1).

        DRF silently ignores extra keys by default, which hides client bugs and
        makes typo'd consent flags look accepted. The API contract is a 400 with
        code `unknown_field`.
      properties:
        new_email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        current_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_email
    EmailChangeResponse:
      type: object
      properties:
        pending:
          type: boolean
        new_email:
          type: string
      required:
      - new_email
      - pending
    EmailChanged:
      type: object
      properties:
        email:
          type: string
          format: email
        email_verified:
          type: boolean
      required:
      - email
      - email_verified
    EmailVerified:
      type: object
      properties:
        email_verified:
          type: boolean
      required:
      - email_verified
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        version:
          type: string
        time:
          type: string
          format: date-time
      required:
      - database
      - status
    LocaleEnum:
      enum:
      - en
      type: string
      description: '* `en` - en'
    LoginRequest:
      type: object
      description: |-
        Reject unknown body fields (api-documentation.md §1.1).

        DRF silently ignores extra keys by default, which hides client bugs and
        makes typo'd consent flags look accepted. The API contract is a 400 with
        code `unknown_field`.
      properties:
        email:
