      - privacy_acknowledged
    OnboardingCompleteResponse:
      type: object
      properties:
        onboarding_completed_at:
          type: string
          format: date-time
      required:
      - onboarding_completed_at
    PasswordChangeRequest:
      type: object
      description: |-
        Reject unknown body fields (api-documentation.md §1.1).

