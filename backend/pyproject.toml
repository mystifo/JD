[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/tests/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "migrations"

[tool.coverage.run]
source = ["apps", "common"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
